<a [routerLink]="['/shop']" [queryParams]="{ localizacion: opcion().slug }"
   class="flex h-full flex-col overflow-hidden rounded-2xl border border-crema-200 bg-white shadow-sm transition-shadow hover:shadow-md">
  @if (opcion().imagen; as imagen) {
    <img [src]="imagen.url" [alt]="imagen.alt || opcion().nombre" loading="lazy" class="h-40 w-full object-cover" />
  }
  <span class="flex flex-1 flex-col justify-between p-6">
    <span class="text-xs font-semibold uppercase tracking-wide text-tinta-suave">Localización</span>
    <span class="mt-3 text-xl font-bold text-bosque-900">{{ opcion().nombre }}</span>
    @if (opcion().total !== undefined) {
      <span class="mt-2 text-sm text-tinta-suave">{{ opcion().total }} rutas</span>
    }
  </span>
</a>

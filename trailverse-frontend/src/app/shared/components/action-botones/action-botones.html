<div class="flex items-center justify-end gap-2">
  <button
    type="button"
    class="rounded-lg px-3 py-1.5 text-xs font-semibold transition-colors"
    [class.bg-bosque-600]="ruta().isActive"
    [class.text-white]="ruta().isActive"
    [class.hover:bg-bosque-500]="ruta().isActive"
    [class.bg-red-600]="!ruta().isActive"
    [class.text-white]="!ruta().isActive"
    [class.hover:bg-red-500]="!ruta().isActive"
    (click)="activar.emit(ruta())">
    {{ ruta().isActive ? 'Desactivar' : 'Activar' }}
  </button>
  <a
    [routerLink]="['/admin/rutas', ruta().slug, 'edit']"
    class="rounded-lg bg-crema-200 px-3 py-1.5 text-xs font-semibold text-tinta transition-colors hover:bg-crema-300">
    Editar
  </a>
  <button
    type="button"
    class="rounded-lg bg-red-100 px-3 py-1.5 text-xs font-semibold text-red-700 transition-colors hover:bg-red-200"
    (click)="eliminar.emit(ruta())">
    Borrar
  </button>
</div>

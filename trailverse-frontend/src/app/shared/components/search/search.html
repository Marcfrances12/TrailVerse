<label class="relative block">
  <span class="sr-only">{{ placeholder() }}</span>
  <svg class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-tinta-suave"
       viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="11" cy="11" r="7" />
    <path d="m20 20-3.5-3.5" />
  </svg>
  <input type="search"
         autocomplete="off"
         [placeholder]="placeholder()"
         [ngModel]="texto()"
         (ngModelChange)="alEscribir($event)"
         class="w-full rounded-full border border-crema-300 bg-white py-2.5 pl-10 pr-4 text-sm text-tinta shadow-sm transition placeholder:text-tinta-suave/70 hover:border-crema-400 focus:border-bosque-500 focus:outline-none focus:ring-4 focus:ring-bosque-100" />
</label>

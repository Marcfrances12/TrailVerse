<div class="space-y-6">
  <div class="flex flex-col gap-1 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h1 class="text-2xl font-bold text-bosque-900 sm:text-3xl">{{ title() }}</h1>
      @if (summary()) {
        <p class="text-tinta-suave">{{ summary() }}</p>
      }
    </div>

    <div class="flex items-center gap-2">
      <button type="button" (click)="toggleTrash.emit()"
        class="inline-flex items-center gap-1.5 rounded-lg border px-4 py-2.5 text-sm font-semibold transition-colors"
        [class.bg-bosque-700]="isTrash()" [class.text-white]="isTrash()" [class.border-bosque-700]="isTrash()"
        [class.border-crema-300]="!isTrash()" [class.text-tinta]="!isTrash()" [class.hover:bg-crema-100]="!isTrash()">
        <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M3 6h18 M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
          <path d="M10 11v6 M14 11v6" />
        </svg>
        {{ isTrash() ? activeLabel() : 'Papelera' }}
      </button>
      @if (!isTrash() && createRoute()) {
        <a [routerLink]="createRoute()" class="rounded-lg bg-bosque-700 px-5 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-bosque-600">
          {{ createLabel() }}
        </a>
      }
    </div>
  </div>

  @if (loading()) {
    <app-skeleton-grid />
  } @else if (error()) {
    <app-error-state [mensaje]="error()!" (reintentar)="retry.emit()" />
  } @else if (empty()) {
    <app-empty-state [titulo]="emptyTitle()" [mensaje]="emptyMessage()" />
  } @else {
    <ng-container [ngTemplateOutlet]="isTrash() ? trashContent : activeContent" />
  }
</div>

<article class="flex h-full flex-col rounded-2xl border border-crema-200 bg-white p-5 shadow-sm transition-shadow hover:shadow-md"
         [class.grayscale]="!papelera() && !user().isActive"
         [class.opacity-70]="papelera()">
  <div class="flex items-start justify-between gap-3">
    <div class="min-w-0">
      <p class="text-xs font-semibold uppercase tracking-wide text-tinta-suave">Usuario</p>
      <h2 class="mt-1 break-words text-lg font-bold text-bosque-900">{{ user().name }}</h2>
    </div>
    @if (papelera()) {
      <span class="shrink-0 rounded-full bg-crema-100 px-2.5 py-1 text-xs font-semibold text-tinta">En papelera</span>
    } @else {
      <span class="shrink-0 rounded-full px-2.5 py-1 text-xs font-semibold"
            [class.bg-bosque-100]="user().isActive" [class.text-bosque-800]="user().isActive"
            [class.bg-red-100]="!user().isActive" [class.text-red-700]="!user().isActive">
        {{ user().isActive ? 'Activo' : 'Inactivo' }}
      </span>
    }
  </div>

  <dl class="mt-5 grid flex-1 gap-3 text-sm">
    <div>
      <dt class="text-xs text-tinta-suave">Email</dt>
      <dd class="mt-1 break-all font-medium text-tinta">{{ user().email }}</dd>
    </div>
    <div>
      <dt class="text-xs text-tinta-suave">Rol</dt>
      <dd class="mt-1 font-medium text-tinta">{{ nombreRol(user()) }}</dd>
    </div>
    @if (papelera()) {
      <div>
        <dt class="text-xs text-tinta-suave">Eliminado</dt>
        <dd class="mt-1 font-medium text-tinta">{{ formatFecha(user().deleted_at) }}</dd>
      </div>
    }
  </dl>

  <div class="mt-5 flex flex-wrap gap-2 border-t border-crema-200 pt-4">
    @if (papelera()) {
      <button type="button" (click)="restaurar.emit(user())"
              class="rounded-lg bg-bosque-600 px-3 py-2 text-xs font-semibold text-white hover:bg-bosque-500">Restaurar</button>
      <button type="button" (click)="borrarDefinitivo.emit(user())"
              class="rounded-lg bg-red-100 px-3 py-2 text-xs font-semibold text-red-700 hover:bg-red-200">Eliminar definitivo</button>
    } @else {
      <button type="button" (click)="cambiarEstado.emit(user())"
              class="rounded-lg px-3 py-2 text-xs font-semibold text-white"
              [class.bg-bosque-600]="user().isActive" [class.hover:bg-bosque-500]="user().isActive"
              [class.bg-red-600]="!user().isActive" [class.hover:bg-red-500]="!user().isActive">
        {{ user().isActive ? 'Desactivar' : 'Activar' }}
      </button>
      <a [routerLink]="['/admin/usuarios', user()._id, 'edit']"
         class="rounded-lg bg-crema-200 px-3 py-2 text-xs font-semibold text-tinta hover:bg-crema-300">Editar</a>
      <button type="button" (click)="eliminar.emit(user())"
              class="rounded-lg bg-red-100 px-3 py-2 text-xs font-semibold text-red-700 hover:bg-red-200">Borrar</button>
    }
  </div>
</article>

<div class="w-full max-w-md">
  <a routerLink="/rutas" class="mb-6 inline-flex items-center gap-1.5 text-sm font-semibold text-bosque-700 transition-colors hover:text-bosque-500">
    <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M15 18 L9 12 L15 6" /></svg>
    Volver a rutas
  </a>

  <div class="rounded-3xl bg-white p-8 shadow-xl ring-1 ring-crema-200 sm:p-10">
    <p class="text-xs font-semibold uppercase tracking-[0.2em] text-bosque-600">Bienvenido de nuevo</p>
    <h1 class="mt-2 font-display text-3xl font-bold text-bosque-950">Iniciar sesión</h1>
    <p class="mt-2 text-sm text-tinta-suave">Accede con tu cuenta para continuar.</p>

    @if (errorServidor(); as mensaje) {
      <div class="mt-6 flex items-start gap-3 rounded-2xl border border-amber-300 bg-amber-50 p-4 text-sm text-amber-900" role="alert">
        <svg viewBox="0 0 24 24" class="mt-0.5 h-5 w-5 shrink-0 text-amber-600" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M12 8v5M12 16h.01" /></svg>
        <span>{{ mensaje }}</span>
      </div>
    }

    <form [formGroup]="formulario" (ngSubmit)="iniciarSesion()" novalidate class="mt-8 space-y-5">
      <div>
        <label for="identificador" class="mb-1.5 block text-sm font-semibold text-tinta">Email o usuario</label>
        <div class="relative">
          <span class="pointer-events-none absolute inset-y-0 left-3.5 flex items-center text-tinta-suave" aria-hidden="true">
            <svg viewBox="0 0 24 24" class="h-[18px] w-[18px]" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4" /><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1" /></svg>
          </span>
          <input id="identificador" type="text" formControlName="identificador" autocomplete="username" placeholder="tu@email.com o tu usuario"
            class="w-full rounded-xl border border-crema-300 bg-crema-50 py-3 pl-11 pr-4 text-sm text-tinta outline-none transition placeholder:text-tinta-suave/60 focus:border-bosque-500 focus:bg-white focus:ring-4 focus:ring-bosque-100"
            [class.border-red-400]="formulario.get('identificador')?.touched && formulario.get('identificador')?.errors" />
        </div>
        @if (mostrarError('identificador'); as mensaje) { <p class="mt-1.5 text-sm text-red-600">{{ mensaje }}</p> }
      </div>

      <div>
        <label for="password" class="mb-1.5 block text-sm font-semibold text-tinta">Contraseña</label>
        <div class="relative">
          <span class="pointer-events-none absolute inset-y-0 left-3.5 flex items-center text-tinta-suave" aria-hidden="true">
            <svg viewBox="0 0 24 24" class="h-[18px] w-[18px]" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" /></svg>
          </span>
          <input id="password" [type]="mostrarPassword() ? 'text' : 'password'" formControlName="password" autocomplete="current-password" placeholder="••••••••"
            class="w-full rounded-xl border border-crema-300 bg-crema-50 py-3 pl-11 pr-12 text-sm text-tinta outline-none transition placeholder:text-tinta-suave/60 focus:border-bosque-500 focus:bg-white focus:ring-4 focus:ring-bosque-100"
            [class.border-red-400]="formulario.get('password')?.touched && formulario.get('password')?.errors" />
          <button type="button" (click)="togglePassword()"
            class="absolute inset-y-0 right-3 flex items-center rounded-lg px-1.5 text-tinta-suave transition-colors hover:text-bosque-700"
            [attr.aria-label]="mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            <svg viewBox="0 0 24 24" class="h-[18px] w-[18px]" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
        @if (mostrarError('password'); as mensaje) { <p class="mt-1.5 text-sm text-red-600">{{ mensaje }}</p> }
      </div>

      <button type="submit" [disabled]="enviando()"
        class="w-full rounded-xl bg-gradient-to-r from-bosque-700 to-bosque-600 px-6 py-3 text-sm font-semibold text-white shadow-lg shadow-bosque-700/20 transition-all hover:-translate-y-0.5 hover:shadow-xl disabled:translate-y-0 disabled:opacity-60">
        {{ enviando() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>
  </div>
</div>

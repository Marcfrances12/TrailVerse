<div class="space-y-6">
  @if (host()?.data; as h) {
    <a routerLink="/admin/hosts" class="inline-flex items-center gap-1.5 text-sm font-semibold text-bosque-700 hover:text-bosque-500">
      <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 18 L9 12 L15 6" /></svg>
      Volver a hosts
    </a>

    <article class="overflow-hidden rounded-2xl border border-crema-200 bg-white shadow-sm" [class.grayscale]="!h.isActive" [class.opacity-80]="!h.isActive">
      <div class="grid gap-8 p-6 lg:grid-cols-[1fr_280px]">
        <div class="space-y-4">
          <h1 class="text-2xl font-bold text-bosque-900 sm:text-3xl">{{ h.name }}</h1>
          @if (h.bio) {
            <p class="leading-relaxed text-tinta-suave">{{ h.bio }}</p>
          }
          <dl class="grid grid-cols-2 gap-4">
            <div class="rounded-xl bg-crema-100 p-3"><dt class="text-[11px] uppercase tracking-wide text-tinta-suave">Email</dt><dd class="mt-1 font-bold text-bosque-800">{{ h.contactEmail }}</dd></div>
            <div class="rounded-xl bg-crema-100 p-3"><dt class="text-[11px] uppercase tracking-wide text-tinta-suave">Teléfono</dt><dd class="mt-1 font-bold text-bosque-800">{{ h.phone || '—' }}</dd></div>
          </dl>
        </div>
        <aside class="space-y-4 rounded-2xl border border-crema-200 bg-crema-50 p-4">
          <h2 class="text-sm font-bold uppercase tracking-wide text-tinta-suave">Acciones</h2>
          <div class="grid gap-2">
            <a [routerLink]="['/admin/hosts', h._id, 'edit']" class="rounded-lg bg-bosque-700 px-4 py-2.5 text-center text-sm font-semibold text-white hover:bg-bosque-600">Editar</a>
            @if (h.isActive) {
              <button type="button" class="rounded-lg bg-red-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-red-700" (click)="cambiarEstado(h)">Desactivar</button>
            } @else {
              <button type="button" class="rounded-lg bg-bosque-500 px-4 py-2.5 text-sm font-semibold text-bosque-950 hover:bg-bosque-400" (click)="cambiarEstado(h)">Activar</button>
            }
            <button type="button" class="rounded-lg border border-red-300 px-4 py-2.5 text-sm font-semibold text-red-700 hover:bg-red-50" (click)="eliminar(h)">Eliminar</button>
          </div>
          <dl class="space-y-2 border-t border-crema-200 pt-4 text-sm">
            <div class="flex justify-between"><dt class="text-tinta-suave">Visibilidad</dt><dd class="font-semibold" [class.text-red-700]="!h.isActive" [class.text-bosque-700]="h.isActive">{{ h.isActive ? 'Activo' : 'Inactivo' }}</dd></div>
            <div class="flex justify-between"><dt class="text-tinta-suave">Creado</dt><dd class="text-right font-semibold text-tinta">{{ formatFecha(h.created_at) }}</dd></div>
          </dl>
        </aside>
      </div>
    </article>
  }
</div>

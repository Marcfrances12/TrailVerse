<article class="flex h-full flex-col rounded-2xl border border-crema-200 bg-white p-5 shadow-sm transition-shadow hover:shadow-md"
         [class.grayscale]="!papelera() && !category().isActive"
         [class.opacity-70]="papelera()">
  <div class="flex items-start justify-between gap-3">
    <div class="min-w-0">
      <p class="text-xs font-semibold uppercase tracking-wide text-tinta-suave">Categoría</p>
      <h2 class="mt-1 break-words text-lg font-bold text-bosque-900">{{ category().name }}</h2>
    </div>
    @if (papelera()) {
      <span class="shrink-0 rounded-full bg-crema-100 px-2.5 py-1 text-xs font-semibold text-tinta">En papelera</span>
    } @else {
      <span class="shrink-0 rounded-full px-2.5 py-1 text-xs font-semibold"
            [class.bg-bosque-100]="category().isActive" [class.text-bosque-800]="category().isActive"
            [class.bg-red-100]="!category().isActive" [class.text-red-700]="!category().isActive">
        {{ category().isActive ? 'Activa' : 'Inactiva' }}
      </span>
    }
  </div>

  <dl class="mt-5 grid flex-1 grid-cols-2 gap-3 text-sm">
    <div>
      <dt class="text-xs text-tinta-suave">Tipo</dt>
      <dd class="mt-1 font-medium text-tinta">{{ category().type }}</dd>
    </div>
    <div>
      <dt class="text-xs text-tinta-suave">Slug</dt>
      <dd class="mt-1 break-all font-medium text-tinta">{{ category().slug }}</dd>
    </div>
    @if (papelera()) {
      <div class="col-span-2">
        <dt class="text-xs text-tinta-suave">Eliminada</dt>
        <dd class="mt-1 font-medium text-tinta">{{ formatFecha(category().deleted_at) }}</dd>
      </div>
    }
  </dl>

  <div class="mt-5 flex flex-wrap gap-2 border-t border-crema-200 pt-4">
    @if (papelera()) {
      <button type="button" (click)="restaurar.emit(category())"
              class="rounded-lg bg-bosque-600 px-3 py-2 text-xs font-semibold text-white hover:bg-bosque-500">Restaurar</button>
      <button type="button" (click)="borrarDefinitivo.emit(category())"
              class="rounded-lg bg-red-100 px-3 py-2 text-xs font-semibold text-red-700 hover:bg-red-200">Eliminar definitivo</button>
    } @else {
      <button type="button" (click)="cambiarEstado.emit(category())"
              class="rounded-lg px-3 py-2 text-xs font-semibold text-white"
              [class.bg-bosque-600]="category().isActive" [class.hover:bg-bosque-500]="category().isActive"
              [class.bg-red-600]="!category().isActive" [class.hover:bg-red-500]="!category().isActive">
        {{ category().isActive ? 'Desactivar' : 'Activar' }}
      </button>
      <a [routerLink]="['/admin/categorias', category()._id, 'edit']"
         class="rounded-lg bg-crema-200 px-3 py-2 text-xs font-semibold text-tinta hover:bg-crema-300">Editar</a>
      <button type="button" (click)="eliminar.emit(category())"
              class="rounded-lg bg-red-100 px-3 py-2 text-xs font-semibold text-red-700 hover:bg-red-200">Borrar</button>
    }
  </div>
</article>

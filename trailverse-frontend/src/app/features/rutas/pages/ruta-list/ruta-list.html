<app-admin-list-shell
  [title]="modoPapelera() ? 'Rutas eliminadas' : 'Rutas de senderismo'"
  [summary]="modoPapelera()
    ? (store.totalEliminados() > 0 ? store.totalEliminados() + (store.totalEliminados() === 1 ? ' ruta eliminada' : ' rutas eliminadas') : 'No hay rutas eliminadas')
    : (store.total() > 0 ? store.total() + (store.total() === 1 ? ' ruta' : ' rutas') + ' disponibles' + (store.activas() !== store.total() ? ' (' + store.activas() + ' activas)' : '') : 'Descubre y gestiona las mejores rutas')"
  [isTrash]="modoPapelera()"
  [activeLabel]="'Ver activas'"
  [loading]="modoPapelera() ? store.cargandoEliminados() : store.cargando()"
  [error]="modoPapelera() ? store.errorEliminados() : store.error()"
  [empty]="modoPapelera() ? store.eliminados().length === 0 : store.rutas().length === 0"
  [emptyTitle]="modoPapelera() ? 'Papelera vacía' : 'Sin resultados'"
  [emptyMessage]="modoPapelera() ? 'No hay rutas eliminadas.' : 'Aún no hay rutas registradas.'"
  [createRoute]="'/admin/rutas/new'"
  [createLabel]="'+ Nueva ruta'"
  (toggleTrash)="alternarPapelera()"
  (retry)="modoPapelera() ? reintentarPapelera() : reintentar()">
  <ng-template #trashContent>
      <div class="overflow-x-auto rounded-2xl border border-crema-200 bg-white shadow-sm">
        <table class="w-full min-w-[700px] text-left text-sm">
          <thead>
            <tr class="border-b border-crema-200 bg-crema-50 text-xs uppercase tracking-wide text-tinta-suave">
              <th class="px-4 py-3 font-semibold">Nombre</th>
              <th class="px-4 py-3 font-semibold">Slug</th>
              <th class="px-4 py-3 font-semibold">Eliminada</th>
              <th class="px-4 py-3 text-right font-semibold">Acciones</th>
            </tr>
          </thead>
          <tbody>
            @for (ruta of store.eliminados(); track ruta._id) {
              <tr class="border-b border-crema-100 transition-colors hover:bg-crema-50/50 opacity-70">
                <td class="px-4 py-3 font-semibold text-bosque-700">{{ ruta.nombre }}</td>
                <td class="px-4 py-3 text-tinta-suave">{{ ruta.slug }}</td>
                <td class="px-4 py-3 text-tinta-suave">{{ formatFecha(ruta.deleted_at) }}</td>
                <td class="px-4 py-3">
                  <div class="flex items-center justify-end gap-2">
                    <button type="button" (click)="restaurar(ruta)"
                      class="rounded-lg bg-bosque-600 px-3 py-1.5 text-xs font-semibold text-white transition-colors hover:bg-bosque-500">
                      Restaurar
                    </button>
                    <button type="button" (click)="borrarDefinitivo(ruta)"
                      class="rounded-lg bg-red-100 px-3 py-1.5 text-xs font-semibold text-red-700 transition-colors hover:bg-red-200">
                      Eliminar definitivo
                    </button>
                  </div>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
  </ng-template>
  <ng-template #activeContent>
    <app-admin-table
      [rutas]="store.rutas()"
      (cambiarEstado)="cambiarEstado($event)"
      (eliminar)="eliminar($event)" />
  </ng-template>
</app-admin-list-shell>

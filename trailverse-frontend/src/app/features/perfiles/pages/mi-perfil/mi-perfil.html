<div class="mx-auto max-w-5xl space-y-8">
  @if (cargando()) {
    <p class="text-sm text-tinta-suave">Cargando perfil…</p>
  } @else if (error(); as mensaje) {
    <div class="rounded-2xl border border-amber-300 bg-amber-50 p-4 text-sm text-amber-900" role="alert">{{ mensaje }}</div>
  } @else if (perfil(); as perfilActual) {
    <app-profile-header
      [nombre]="perfilActual.name"
      [email]="auth.user()?.email ?? null"
      [rol]="auth.user()?.role ?? null"
      [avatarUrl]="perfilActual.avatarUrl" />

    <div class="grid gap-8 lg:grid-cols-[1fr_280px]">
      <app-profile-form [perfil]="perfilActual" (guardado)="onGuardado($event)" />

      <aside class="h-fit space-y-5 rounded-3xl border border-crema-200 bg-white p-6 shadow-sm">
        <div>
          <h2 class="text-sm font-bold uppercase tracking-wide text-tinta-suave">Cuenta</h2>
          <p class="mt-1 text-xs text-tinta-suave">Estos datos los gestiona el administrador.</p>
        </div>
        <dl class="space-y-4 text-sm">
          <div>
            <dt class="text-xs uppercase tracking-wide text-tinta-suave">Email</dt>
            <dd class="mt-0.5 break-all font-semibold text-tinta">{{ auth.user()?.email }}</dd>
          </div>
          <div>
            <dt class="text-xs uppercase tracking-wide text-tinta-suave">Rol</dt>
            <dd class="mt-0.5 font-semibold text-tinta">{{ auth.user()?.role }}</dd>
          </div>
          <div>
            <dt class="text-xs uppercase tracking-wide text-tinta-suave">Estado</dt>
            <dd class="mt-1">
              <span class="rounded-full bg-bosque-100 px-2.5 py-1 text-xs font-semibold text-bosque-800">Activa</span>
            </dd>
          </div>
        </dl>
      </aside>
    </div>
  }
</div>

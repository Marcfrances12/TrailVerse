<form (submit)="enviarFormulario($event)" novalidate class="space-y-3">
  <div class="flex flex-wrap items-center gap-3">
    <span class="text-sm font-semibold text-tinta">Tu valoración</span>
    <app-estrellas [(valor)]="valoracion" [editable]="true" tamano="lg" />
  </div>
  @if (intentado() && errorValoracion(); as error) {
    <p class="text-xs font-semibold text-red-700">{{ error }}</p>
  }

  <div class="space-y-1">
    <label class="sr-only" for="comentario-texto">Comentario</label>
    <textarea id="comentario-texto" rows="4" [value]="texto()" (input)="alEscribir($event)"
              [attr.maxlength]="max"
              [attr.aria-invalid]="intentado() && !!errorTexto()"
              placeholder="Cuenta cómo fue tu experiencia en la ruta…"
              class="w-full resize-y rounded-2xl border border-crema-300 bg-white px-4 py-3 text-sm text-tinta shadow-sm focus:border-bosque-500 focus:outline-none focus:ring-2 focus:ring-bosque-300"></textarea>
    <div class="flex justify-between gap-3 text-xs">
      <span class="font-semibold text-red-700">
        @if (intentado() && errorTexto(); as error) { {{ error }} }
      </span>
      <span class="text-tinta-suave">{{ longitud() }}/{{ max }}</span>
    </div>
  </div>

  <div class="flex flex-wrap gap-2">
    <button type="submit" [disabled]="enviando()"
            class="rounded-full bg-bosque-700 px-5 py-2 text-sm font-semibold text-white transition-colors hover:bg-bosque-600 disabled:cursor-wait disabled:opacity-60">
      {{ enviando() ? 'Enviando…' : textoBoton() }}
    </button>
    @if (cancelable()) {
      <button type="button" (click)="cancelar.emit()" [disabled]="enviando()"
              class="rounded-full border border-crema-300 bg-white px-5 py-2 text-sm font-semibold text-tinta transition-colors hover:bg-crema-100">
        Cancelar
      </button>
    }
  </div>
</form>

@let c = comentario();
<article class="space-y-3 rounded-2xl border bg-white p-4 shadow-sm"
         [class.border-bosque-300]="c.esMio" [class.border-crema-200]="!c.esMio">
  <header class="flex items-start justify-between gap-3">
    <div class="flex min-w-0 items-center gap-3">
      <app-user-avatar [nombre]="c.autor.nombre" [url]="c.autor.avatarUrl ?? ''" />
      <div class="min-w-0">
        <p class="truncate text-sm font-semibold text-tinta">
          {{ c.autor.nombre }}
          @if (c.esMio) { <span class="ml-1 rounded-full bg-bosque-100 px-2 py-0.5 text-xs text-bosque-800">Tú</span> }
        </p>
        <p class="text-xs text-tinta-suave">
          {{ formatFecha(c.created_at) }}@if (c.editado) { · editado }
        </p>
      </div>
    </div>
    @if (!editando()) {
      <app-estrellas [valor]="c.valoracion" />
    }
  </header>

  @if (editando()) {
    <app-comentario-form [inicial]="{ texto: c.texto, valoracion: c.valoracion }"
                         [enviando]="enviando()" textoBoton="Guardar cambios" [cancelable]="true"
                         (enviar)="guardar.emit($event)" (cancelar)="cancelarEdicion.emit()" />
  } @else {
    <p class="whitespace-pre-line text-sm leading-relaxed text-tinta">{{ c.texto }}</p>

    @if (c.esMio || puedeBorrar()) {
      <div class="flex gap-3 text-xs font-semibold">
        @if (c.esMio) {
          <button type="button" (click)="empezarEdicion.emit()" class="text-bosque-700 hover:text-bosque-500">Editar</button>
        }
        <button type="button" (click)="borrar.emit()" [disabled]="enviando()" class="text-red-700 hover:text-red-500 disabled:opacity-50">
          Borrar
        </button>
      </div>
    }
  }
</article>
